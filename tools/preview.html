<!doctype html>
<meta charset="utf-8">
<title>Pattern preview</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body { padding: 8px; font: 11px sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .cell { border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
  .cell img { width: 100%; display: block; }
</style>
<div class="grid" id="g"></div>
<script type="module">
  // Every animation pattern as a 3D thumbnail (its working frame).
  // ?hold=barbell&cols=4&only=squat,bench&pm=quadriceps&sm=glutes
  import { PATTERNS } from '../js/anim.js';
  import { thumbnail } from '../js/body3d.js';
  const q = new URLSearchParams(location.search);
  const g = document.getElementById('g');
  if (q.get('cols')) g.style.gridTemplateColumns = `repeat(${q.get('cols')}, 1fr)`;
  const eq = { barbell: 'barbell', dumbbell: 'dumbbell', cable: 'cable' }[q.get('hold')] || 'barbell';
  const only = q.get('only')?.split(',');
  const jobs = [];
  for (const id of Object.keys(PATTERNS)) {
    if (only && !only.includes(id)) continue;
    const c = document.createElement('div'); c.className = 'cell';
    c.innerHTML = `<b>${id}</b><img>`;
    g.appendChild(c);
    jobs.push(thumbnail({ anim: id, eq, pm: (q.get('pm') || 'quadriceps').split(','), sm: (q.get('sm') || '').split(',').filter(Boolean) }).then((u) => { c.querySelector('img').src = u; }));
  }
  Promise.all(jobs).then(() => { document.body.dataset.done = '1'; });
</script>
