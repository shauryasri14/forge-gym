<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forge</title>
  <meta name="description" content="Gym tracker with 870+ exercises, animated form demos and a consistency heatmap.">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="top">
    <button id="back" class="icon-btn" aria-label="Back" hidden>‹</button>
    <h1 id="title">Forge</h1>
    <button id="gear" class="icon-btn" aria-label="Settings">⚙</button>
  </header>
  <main id="view"><div class="empty"><p class="muted">Loading…</p></div></main>
  <div id="rest" role="timer" aria-live="off">
    <i id="rest-p"></i>
    <span>Rest <b id="rest-t">0:00</b></span>
    <button id="rest-m">−15s</button><button id="rest-p15">+15s</button><button id="rest-x">Skip</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <nav id="nav">
    <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24"><path d="M3 9h2v6H3zM19 9h2v6h-2zM6 7h3v10H6zM15 7h3v10h-3zM9 11h6v2H9z"/></svg>Exercises</a>
    <a href="#/workout" data-tab="workout"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 9.4 3.2 2-1 1.6L11 13.5V7h2z"/></svg>Workout</a>
    <a href="#/history" data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4z"/></svg>History</a>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
